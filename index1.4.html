<h3>Cybersecurity threats</h3><ul><li><b>What:</b> efforts to compromise the confidentiality, integrity or availability of computer systems, and of the data and physical processes they control.</li><li><b>Actors:</b> criminals, insiders, activists and sometimes states.</li><li><b>Usual lead:</b> the system’s owner and operator, supported by civilian agencies. For drinking water, EPA is the lead federal agency for the sector, CISA supports technical defense and information sharing, and the FBI investigates crimes.</li><li><b>Tools:</b> patching, network segmentation, incident response, information sharing, and regulation of operators.</li><li><b>Core question:</b> how do we protect, detect and recover?</li></ul>
<h3>National security threats</h3><ul><li><b>What:</b> threats to a nation’s sovereignty, territory, military capability or the core functions of government.</li><li><b>Actors:</b> most often foreign states or state-directed groups, or terrorist organizations.</li><li><b>Usual lead:</b> defense, intelligence, diplomatic and national-security law enforcement agencies.</li><li><b>Tools:</b> intelligence collection, deterrence, sanctions, export controls, foreign-investment screening and military options.</li><li><b>Constraint:</b> key information is often classified, which limits what local operators can be told.</li><li><b>Core question:</b> who is doing this, and how do we deter or respond?</li></ul>
<h3>Where they overlap</h3><p>Federal policy treats water and wastewater as one of the critical infrastructure sectors, because society and the military both depend on them. Many military installations rely on civilian utilities outside the fence. One intrusion can be both a cyber incident, because a vulnerability was exploited, and a national security event, because a foreign state may be positioning to cause harm.</p>
<h3>Why it is hard to choose</h3><p>Attribution is slow and uncertain. Early on, you may not even know whether the problem is malicious. Framing it as national security too soon can slow the operator’s technical response and keep information from those who need it. Treating it as only a cyber incident can miss a strategic threat and the tools to counter it.</p>
<h3>What AI adds</h3><p>When AI helps run a system, failures can look like attacks and attacks can look like failures. Odd behavior might come from bad data, a software fault or manipulation. That uncertainty is what you will work with in this lab.</p>

 <div class="grid">${STAKE.map((s,i)=>`<button class="sk ${S.met.includes(i)?"open":""}" onclick="meet(${i},this)"><h3>${s[0]}</h3><span class="tap">Select to meet</span><div class="more"><p><b>Needs:</b> ${s[1]}</p><p><b>Worries:</b> ${s[2]}</p></div></button>`).join("")}</div>
 <section id="p2" ${m>=6?"":"hidden"} style="margin-top:24px"><h3>2 · Weigh the competing interests</h3><p class="mu">Drag each slider to show where you would lean. Move all three.</p>
 ${TENS.map((t,i)=>`<div class="card"><div class="tl"><span>${t[0]}</span><span>${t[1]}</span></div><input type="range" min="0" max="100" value="${S.tv[i]??50}" aria-label="${t[0]} versus ${t[1]}" oninput="tens(${i},this.value)"><div class="mu" id="tr${i}">${tread(i)}</div></div>`).join("")}
 <span id="tk" class="ck">${tdone()?"✓ Checkpoint complete":""}</span></section>
 <section id="p3" ${tdone()?"":"hidden"} style="margin-top:24px"><h3>3 · Test the uncertainty</h3><p class="mu">What caused the chlorine swings? Request evidence and watch the odds move.</p>
 ${HYP.map((h,i)=>`<div class="hb"><span>${h}</span><div class="bar"><i id="hb${i}" style="width:${S.prob[i]}%"></i></div><b id="hv${i}">${Math.round(S.prob[i])}%</b></div>`).join("")}
 <ul id="cl">${CLUES.slice(0,S.clues).map(c=>`<li>${c[0]}</li>`).join("")}</ul>
 <button class="btn" id="cb" onclick="clue()" ${S.clues>=3?"disabled":""}>Request evidence (${S.clues} of 3)</button><span id="uk" class="ck">${S.clues>=3?"✓ Checkpoint complete":""}</span><p class="mu" id="un">${S.clues>=3?UNMSG:""}</p></section>
 <section id="p4" ${S.clues>=3?"":"hidden"} style="margin-top:24px"><h3>4 · Your assessment</h3><p class="mu">Choose a side (no fence-sitting), then write 4–5 sentences: your framing, who should lead and why, the key uncertainty, and the main trade-off you accept.</p>
 ${["Primarily a cybersecurity threat","Primarily a national security threat"].map(f=>`<label class="r"><input type="radio" name="fr" value="${f}" ${S.frame==f?"checked":""} onchange="S.frame=this.value;upd()">${f}</label>`).join("")}
 <textarea id="ta" aria-label="Threat-framing assessment" oninput="S.text=this.value;upd()">${S.text}</textarea><p class="mu" id="cnt"></p>
 <button class="btn" id="sub" onclick="submitA()">Submit assessment</button><div id="done">${S.submitted?contBtn("Continue to Your Memo",3):""}</div></section>`}
const contBtn=(t,i)=>`<div class="card reveal" style="margin-top:14px"><p class="good" style="margin:0 0 10px"><b>Saved.</b> The next step is unlocked.</p><button class="btn" onclick="go(${i})">${t}</button></div>`;
function meet(i,el){if(!S.met.includes(i))S.met.push(i);el.classList.add("open");const m=S.met.length;$("#mc").textContent=m+" of 6";$("#mm").style.width=(m/6*100)+"%";if(m>=6){$("#mk").textContent="✓ Checkpoint complete";showSec("p2")}}
function tens(i,v){S.tv[i]=+v;S.tt[i]=1;$("#tr"+i).textContent=tread(i);if(tdone()){$("#tk").textContent="✓ Checkpoint complete";showSec("p3")}}
function clue(){if(S.clues>=3)return;const[c,lr]=CLUES[S.clues];S.clues++;const w=S.prob.map((p,i)=>p*lr[i]),t=w.reduce((a,b)=>a+b,0);S.prob=w.map(x=>x/t*100);
 S.prob.forEach((p,i)=>{$("#hb"+i).style.width=p+"%";$("#hv"+i).textContent=Math.round(p)+"%"});$("#cl").insertAdjacentHTML("beforeend",`<li class="reveal">${c}</li>`);
 $("#cb").textContent=`Request evidence (${S.clues} of 3)`;if(S.clues>=3){$("#cb").disabled=true;$("#uk").textContent="✓ Checkpoint complete";$("#un").textContent=UNMSG;showSec("p4")}}
function upd(){const n=sents(S.text),ok=n>=4&&n<=5&&S.frame;$("#cnt").textContent=n+" sentence"+(n==1?"":"s")+" · need 4–5 (each at least 4 words)";$("#sub").disabled=!ok}
function submitA(){S.submitted=true;if(!S.side)S.side=/cyber/i.test(S.frame)?"cyb":"nat";unlock(3);$("#done").innerHTML=contBtn("Continue to Your Memo",3);$("#steps").innerHTML=stepsHtml()}
/* step 4 */
function memoHtml(){return `<h2>Your Memo</h2><p class="mu">Write the memo you would send to the principal. Choose a side, write 5–8 sentences, and pick up to three policy actions. The simulation tests exactly these actions.</p>
 <details class="card"><summary>See two model memos (optional)</summary>${["nat","cyb"].map(k=>`<h3 style="margin-top:12px">${MEMOS[k].t}</h3><p class="mu">${MEMOS[k].s.join(" ")}</p>`).join("")}</details>
 <h3>1 · Choose a side</h3>${[["cyb","Cybersecurity-led"],["nat","National-security-led"]].map(o=>`<label class="r"><input type="radio" name="sd" value="${o[0]}" ${S.side==o[0]?"checked":""} onchange="S.side=this.value;updM()">${o[1]}</label>`).join("")}
 <h3 style="margin-top:14px">2 · Write your memo (5–8 sentences)</h3><textarea id="mtx" aria-label="Policy memo" oninput="S.memoText=this.value;updM()">${S.memoText}</textarea><p class="mu" id="mcn"></p>
 <h3 style="margin-top:14px">3 · Policy actions your memo recommends (1–3)</h3>${Object.keys(LEV).map(k=>`<label class="chk"><input type="checkbox" ${S.levers.includes(k)?"checked":""} onchange="togLev('${k}',this)"><span>${LEV[k].n}</span></label>`).join("")}<p class="mu" id="lcn"></p>
 <button class="btn" id="msub" onclick="submitM()">Submit memo</button><div id="mdone">${S.memoDone?contBtn("Continue to State Policies",4):""}</div>`}
function togLev(k,el){const i=S.levers.indexOf(k);if(i>=0)S.levers.splice(i,1);else if(S.levers.length<3)S.levers.push(k);else el.checked=false;updM()}
function updM(){const n=sents(S.memoText);$("#mcn").textContent=n+" sentence"+(n==1?"":"s")+" · need 5–8 (each at least 4 words)";$("#lcn").textContent=S.levers.length+" of 3 actions selected";
 document.querySelectorAll(".chk input").forEach(i=>i.disabled=!i.checked&&S.levers.length>=3);$("#msub").disabled=!(S.side&&n>=5&&n<=8&&S.levers.length>=1)}
function submitM(){S.memoDone=true;unlock(4);$("#mdone").innerHTML=contBtn("Continue to State Policies",4);$("#steps").innerHTML=stepsHtml()}
/* step 5 */
function mapHtml(){return `<h2>State Policies</h2><p class="mu">All 50 states are shown. Blue tiles have a researched summary; grey tiles do not yet. Select up to three states to test your memo against.</p>
 <div class="card"><h3>The national picture</h3><ul><li>NCSL counted about 1,262 AI measures introduced and 227 enacted in 2025, and 1,539 introduced and 280 enacted through early October 2026. (Second-hand report of NCSL remarks; other trackers count differently.)</li><li>All 50 states introduced AI legislation in 2025. Deepfake bills were the most common type enacted in 2026, and comprehensive frameworks stayed rare.</li></ul>
 <p class="mu">Sources: ${link([["TechJack: NCSL Base Camp numbers","https://techjacksolutions.com/?p=99320"],["NCSL: states lead on AI","https://www.ncsl.org/state-legislatures-news/details/as-congress-deliberates-states-lead-the-way-on-ai-regulation"]])}</p></div>
 <div class="key"><span><i style="background:var(--water)"></i>Researched summary</span><span><i style="background:var(--bd)"></i>Not yet researched</span><span><i style="outline:3px solid var(--wa)"></i>Selected</span></div>
 <div class="map" role="group" aria-label="Tile map of the 50 states">${Object.keys(TILES).map(k=>{const[r,c]=TILES[k];return `<button class="tile ${ST[k]?"deep":""}" data-k="${k}" style="grid-row:${r+1};grid-column:${c+1}" title="${SN[k]}" onclick="togState('${k}')">${k}</button>`}).join("")}</div>
 <p class="mu" id="msg"></p><div id="det"></div>
 <div class="card"><h3>${FED.t}</h3><ul>${FED.p.map(r=>`<li>${r}</li>`).join("")}</ul><p class="mu">Sources: ${link(FED.src)}</p></div>
 <button class="btn" id="mgo" onclick="unlock(5);go(5)">Continue to the simulation</button>`}
function detCard(k){if(!ST[k])return `<div class="card reveal warn"><h3>${SN[k]}</h3><p class="mu" style="margin:0">Not researched in this prototype. All 50 states introduced AI legislation in 2025, but I have not verified what applies to infrastructure here. The simulation treats it as a baseline with no state-specific effects. Check the NCSL AI Legislation Database before relying on it.</p></div>`;
 const t=ST[k],a=t[S.side];return `<div class="card reveal"><h3>${t.n}: ${t.law}</h3>${t.lc?'<span class="tag">Lower confidence</span>':""}<p><b>Effect on your ${S.side=="nat"?"national-security-led":"cybersecurity-led"} memo: ${RL[a[0]]}.</b> ${a[1]}</p><ul>${t.rules.map(r=>`<li>${r}</li>`).join("")}</ul><p class="mu">Sources: ${link(t.src)}</p><p class="mu">Rules come from the linked sources. The effect rating is draft analysis by the AI assistant. Verify against statute text.</p></div>`}
function togState(k){const i=S.states.indexOf(k);if(i>=0)S.states.splice(i,1);else if(S.states.length<3)S.states.push(k);else{$("#msg").textContent="Choose up to three states. Deselect one first.";return}updMap()}
function updMap(){document.querySelectorAll(".tile").forEach(t=>{const on=S.states.includes(t.dataset.k);t.classList.toggle("sel",on);t.setAttribute("aria-pressed",on)});$("#det").innerHTML=S.states.map(detCard).join("");$("#mgo").disabled=S.states.length<1;$("#msg").textContent="Selected: "+(S.states.map(k=>SN[k]).join(", ")||"none")+" (max 3)"}
/* step 6 */
function simHtml(){return `<h2>Simulation</h2><p class="mu">Your policy runs through a 12-week model for each selected state, 500 times with random variation. It is a teaching model with illustrative parameters, not a forecast.</p>
 <div class="card"><h3>Your policy</h3><p style="margin:0">${S.side=="nat"?"National-security-led":"Cybersecurity-led"}: ${S.levers.map(k=>LEV[k].n).join("; ")}</p><p class="mu" style="margin:6px 0 0">States: ${S.states.map(k=>SN[k]).join(", ")}</p></div>
 <div class="card"><label for="pp" class="mu">Chance the incident is deliberate and foreign-directed: <b id="pv">${S.p}%</b></label><input id="pp" type="range" min="0" max="100" value="${S.p}" oninput="S.p=+this.value;$('#pv').textContent=this.value+'%'"></div>
 <div class="card"><h3>Predict first</h3><p class="mu">How will your policy hold up across these states overall?</p>${["Robust","Mixed","Fragile"].map(o=>`<label class="r"><input type="radio" name="gs" ${S.guess==o?"checked":""} onchange="S.guess='${o}';$('#run').disabled=false">${o}</label>`).join("")}</div>
 <button class="btn" id="run" onclick="runSim()" ${S.guess?"":"disabled"}>Run simulation</button><div id="res"></div>`}
function runSim(){const N=500,sim={};
 S.states.forEach(k=>{const m=(ST[k]&&ST[k].m)||{},rg=rng(S.seed),fin=[[],[],[],[]],tr=Array.from({length:13},()=>[[],[],[],[]]),rep=m.rep?(S.levers.includes("report")?1:.5):1;
  for(let n=0;n<N;n++){const mal=rg()<S.p/100,mu=S.levers.map(()=>.7+.6*rg());let v=[60,10,40,70];tr[0].forEach((a,j)=>a.push(v[j]));
   for(let w=1;w<=12;w++){const r6=rg();let d=[-.5,1.5,.5,0];S.levers.forEach((id,i)=>LEV[id].d.forEach((x,j)=>d[j]+=x*mu[i]));
    if(S.side=="nat"){d[1]+=.3;d[2]-=.3}else{d[1]-=.1;d[2]+=.3}
    d[0]+=(m.H||0)*rep;d[1]+=(m.A||0)*rep;d[2]+=(m.I||0)*rep;v=v.map((x,j)=>Math.max(0,Math.min(100,x+d[j])));
    if(mal&&w==4)v[0]=Math.max(0,v[0]-15*(1-Math.min(1,v[2]/80)));
    if(mal&&w==7&&!S.levers.some(x=>x=="foreign"||x=="mil"))v[1]=Math.max(0,v[1]-8);
    if(m.pre&&w==6&&r6<m.pre)v[3]=Math.max(0,v[3]-15);tr[w].forEach((a,j)=>a.push(v[j]))}
   v.forEach((x,j)=>fin[j].push(x))}
  const q=(a,p)=>{a.sort((x,y)=>x-y);return a[Math.floor(p*(a.length-1))]};
  const med=[0,1,2,3].map(j=>tr.map(w=>q(w[j],.5))),f=fin.map(a=>({m:q(a,.5),lo:q(a,.1),hi:q(a,.9)}));
  sim[k]={med,fin:f,overall:f.reduce((s,x)=>s+x.m,0)/4}});
 S.sim=sim;unlock(6);$("#steps").innerHTML=stepsHtml();showRes()}
const COL=["var(--water)","var(--ac)","var(--wa)","var(--ok)"];
function chartSvg(k){const W=640,H=220,x=w=>40+w*(W-60)/12,y=v=>H-26-v*(H-46)/100;let g="";[0,50,100].forEach(v=>g+=`<line x1="40" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="32" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mu)">${v}</text>`);
 [0,4,8,12].forEach(w=>g+=`<text x="${x(w)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mu)">Wk ${w}</text>`);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Median trajectory of four outcomes over 12 weeks for ${SN[k]}">${g}${OUT.map((o,j)=>`<polyline id="ln-${k}-${j}" fill="none" stroke="${COL[j]}" stroke-width="2.5"/>`).join("")}</svg><p class="mu">${OUT.map((o,j)=>`<span style="color:${COL[j]}">●</span> ${o}`).join(" &nbsp; ")}</p>`}
function draw(k,f){const W=640,H=220,x=w=>40+w*(W-60)/12,y=v=>H-26-v*(H-46)/100,n=Math.max(1,Math.floor(f*12)+1);S.sim[k].med.forEach((a,j)=>{$(`#ln-${k}-${j}`).setAttribute("points",a.slice(0,n).map((v,w)=>x(w)+","+y(v)).join(" "))})}
function play(k){if(raf2)cancelAnimationFrame(raf2);const t0=performance.now(),L=n=>{const f=Math.min(1,(n-t0)/3000);draw(k,f);if(f<1)raf2=requestAnimationFrame(L)};raf2=requestAnimationFrame(L)}
function showRes(){const ks=S.states,avg=ks.reduce((a,k)=>a+S.sim[k].overall,0)/ks.length,sc=ks.map(k=>S.sim[k].overall),spread=Math.max(...sc)-Math.min(...sc);
 $("#res").innerHTML=ks.map(k=>{const r=S.sim[k];return `<div class="card reveal" style="margin-top:14px"><h3>${SN[k]}: ${V(r.overall)} (${Math.round(r.overall)}/100)</h3><p class="mu">${noteFor(k)}</p>${OUT.map((o,j)=>`<div class="hb"><span>${o}<br><span class="mu" style="font-size:12px">10–90%: ${Math.round(r.fin[j].lo)}–${Math.round(r.fin[j].hi)}</span></span><div class="bar"><i style="width:${r.fin[j].m}%"></i></div><b>${Math.round(r.fin[j].m)}</b></div>`).join("")}${chartSvg(k)}<button class="btn alt" onclick="play('${k}')">Replay the 12 weeks</button></div>`}).join("")+
 `<div class="card ${S.guess==V(avg)?"":"warn"}"><h3>Your prediction</h3><p>You predicted <b>${S.guess}</b>. Across your states the model says <b>${V(avg)}</b> (${Math.round(avg)}/100). ${S.guess==V(avg)?"✓ Match.":"The result differed from your prediction."}</p><p class="mu">Spread across selected states: ${spread.toFixed(1)} points. In this model your own policy actions drive most of the result and state AI rules shift it only slightly. That is a modeling assumption consistent with the finding that most state AI laws do not reach a water plant directly, not an empirical result.</p></div>`+contBtn("Continue to your certificate",6);
 ks.forEach(k=>draw(k,1))}
/* step 7 */
function certHtml(){return `<h2>Certificate</h2><p class="mu noprint">Enter your name to generate a certificate of completion you can print or save as a PDF.</p><div class="noprint"><input type="text" id="nm" maxlength="60" placeholder="Your full name" value="${esc(S.name)}" oninput="S.name=this.value.trim();$('#cb2').disabled=!S.name"><button class="btn" id="cb2" onclick="mkCert()" ${S.name?"":"disabled"}>Create certificate</button></div><div id="cert"></div>`}
function mkCert(){const ks=S.states,avg=ks.reduce((a,k)=>a+S.sim[k].overall,0)/ks.length;
 $("#cert").innerHTML=`<div class="cert reveal" style="margin-top:16px"><p class="sm">RANDomly Complex</p><h2>Certificate of Completion</h2><p>This certifies that</p><div class="nm">${esc(S.name)}</div><p>completed <b>AI-Enabled Policy Decision Support: Cybersecurity or National Security?</b>, including a threat-framing assessment, a policy memo, a review of state AI policies and a policy simulation.</p><p>Stance: ${S.side=="nat"?"National-security-led":"Cybersecurity-led"} · States tested: ${ks.map(k=>SN[k]).join(", ")} · Overall result: ${V(avg)} (${Math.round(avg)}/100)</p><p class="sm">Completed ${new Date().toLocaleDateString()}. Course exercise prototype, not an accredited credential. Simulation values are illustrative.</p></div><div class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button></div>`}
/* router */
function render(){$("#steps").innerHTML=stepsHtml();const v=$("#view");
 if(S.cur==0){v.innerHTML=defineHtml();initDefine()}
 if(S.cur==1){v.innerHTML=`<h2>Scenario</h2><svg id="svg" viewBox="0 0 800 420" role="img" aria-label="Animation: a community and a military base share one water plant; chlorine readings then rise"></svg><div class="cap" id="cap" aria-live="polite"></div><div class="meter" style="margin-bottom:12px"><i id="tp"></i></div><button class="btn alt" onclick="skip()">Skip</button> <button class="btn" id="cont" style="display:none" onclick="finish()">Continue</button>`;startAnim()}
 if(S.cur==2){v.innerHTML=problemHtml();upd()}
 if(S.cur==3){if(!S.side&&S.frame)S.side=/cyber/i.test(S.frame)?"cyb":"nat";v.innerHTML=memoHtml();updM()}
 if(S.cur==4){v.innerHTML=mapHtml();updMap()}
 if(S.cur==5){v.innerHTML=simHtml();if(S.sim&&S.states.every(k=>S.sim[k]))showRes()}
 if(S.cur==6){v.innerHTML=certHtml();if(S.name)mkCert()}}

/* animation */
const T=13,P=[3.5,6];const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const CAPS=["A civilian community and a military installation draw water from one AI-managed treatment plant.","At the plant, the AI controller starts reporting something unusual.","Chlorine readings climb past the regulatory limit with no clear explanation.","Malfunction, intrusion or deliberate act? The framing you choose will shape the response."];
function scene(){let h="";for(let i=0;i<6;i++){const x=50+(i%3)*80,y=190+Math.floor(i/3)*70;h+=`<rect x="${x}" y="${y}" width="40" height="30" fill="var(--sf)" stroke="var(--mu)"/><polygon points="${x-4},${y} ${x+20},${y-18} ${x+44},${y}" fill="var(--wa)"/>`}
 return `<rect width="800" height="420" fill="var(--sf)"/><g id="w"><rect x="-400" y="150" width="1600" height="400" fill="var(--ground)"/>
 <line x1="400" y1="235" x2="160" y2="235" stroke="var(--water)" stroke-width="5"/><line x1="400" y1="235" x2="600" y2="235" stroke="var(--water)" stroke-width="5"/>${h}
 <text x="150" y="340" font-size="14" text-anchor="middle" fill="var(--tx)">Civilian community</text>
 <rect x="560" y="170" width="200" height="150" fill="none" stroke="var(--tx)" stroke-dasharray="6 4"/><rect x="590" y="200" width="50" height="40" fill="var(--mu)"/><rect x="660" y="200" width="60" height="40" fill="var(--mu)"/><line x1="730" y1="190" x2="730" y2="150" stroke="var(--tx)" stroke-width="2"/><polygon points="730,150 750,157 730,164" fill="var(--wa)"/>
 <text x="660" y="340" font-size="14" text-anchor="middle" fill="var(--tx)">Military installation</text>
 <rect x="370" y="205" width="60" height="50" fill="var(--ac)"/><circle cx="400" cy="195" r="18" fill="var(--water)"/><text x="400" y="278" font-size="12" text-anchor="middle" fill="var(--tx)">AI-managed plant</text></g>
 <g id="ch" opacity="0"><rect x="440" y="40" width="340" height="210" rx="10" fill="var(--sf)" stroke="var(--bd)"/><text x="456" y="64" font-size="13" fill="var(--tx)">Chlorine residual (mg/L, illustrative)</text>
 <line x1="470" x2="765" y1="${230-4/6*150}" y2="${230-4/6*150}" stroke="var(--wa)" stroke-dasharray="5 3"/><text x="765" y="${224-4/6*150}" font-size="11" text-anchor="end" fill="var(--wa)">Regulatory limit 4.0</text>
 <line x1="470" x2="470" y1="80" y2="230" stroke="var(--mu)"/><line x1="470" x2="765" y1="230" y2="230" stroke="var(--mu)"/><polyline id="ln" fill="none" stroke="var(--ac)" stroke-width="2.5" points=""/><text id="val" x="456" y="244" font-size="14" font-weight="700" fill="var(--tx)"></text></g>`}
function fr(t){const k=t<P[0]?0:t<P[1]?ease((t-P[0])/(P[1]-P[0])):1,s=1+1.3*k,tx=k*(220-2.3*400),ty=k*(210-2.3*235);
 $("#w").setAttribute("transform",`translate(${tx} ${ty}) scale(${s})`);
 const o=Math.max(0,Math.min(1,(t-P[1])/.8));$("#ch").setAttribute("opacity",o);
 const q=Math.max(0,Math.min(1,(t-P[1])/(T-1-P[1]))),n=Math.floor(q*60);let pts="",last=1.5;
 for(let i=0;i<=n;i++){const r=i/60,v=1.5+.18*Math.sin(i*.9)+(r>.4?Math.pow((r-.4)/.6,1.4)*4.2:0);last=v;pts+=(470+r*295)+","+(230-v/6*150)+" "}
 $("#ln").setAttribute("points",pts);$("#val").textContent=t>=P[1]?last.toFixed(1)+" mg/L":"";$("#val").setAttribute("fill",last>4?"var(--wa)":"var(--tx)");
 const ph=t<P[0]?0:t<P[1]?1:t<T-1?2:3;$("#cap").textContent=CAPS[ph];$("#tp").style.width=Math.min(100,t/T*100)+"%"}
function startAnim(){$("#svg").innerHTML=scene();if(matchMedia("(prefers-reduced-motion:reduce)").matches){fr(T);ended();return}
 if(S.animDone){fr(T);$("#cont").style.display="";return}
 const t0=performance.now();const loop=n=>{const t=(n-t0)/1000;fr(Math.min(t,T));if(t<T)raf=requestAnimationFrame(loop);else ended()};raf=requestAnimationFrame(loop)}
function ended(){$("#cont").style.display="";if(!S.animDone){S.animDone=true;unlock(2);setTimeout(()=>{if(S.cur==1)finish()},1800)}}
function skip(){stopAnim();fr(T);ended()}
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=null}
function finish(){unlock(2);go(2)}

render();
</script></body></html>
