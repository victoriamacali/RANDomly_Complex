const DEF=`<h3>Why the Label Matters</h3><p>Policy problems rarely arrive labeled. Whether an incident is called a cybersecurity threat or a national security threat decides who leads, which authorities apply, what information can be shared and which tools are on the table.</p>
<h3>Cybersecurity Threats</h3><ul><li><b>What:</b> efforts to compromise the confidentiality, integrity or availability of computer systems, and of the data and physical processes they control.</li><li><b>Actors:</b> criminals, insiders, activists and sometimes states.</li><li><b>Usual lead:</b> the system’s owner and operator, supported by civilian agencies. For drinking water, EPA is the lead federal agency for the sector, CISA supports technical defense and information sharing, and the FBI investigates crimes.</li><li><b>Tools:</b> patching, network segmentation, incident response, information sharing, and regulation of operators.</li><li><b>Core question:</b> how do we protect, detect and recover?</li></ul>
<h3>National Security Threats</h3><ul><li><b>What:</b> threats to a nation’s sovereignty, territory, military capability or the core functions of government.</li><li><b>Actors:</b> most often foreign states or state-directed groups, or terrorist organizations.</li><li><b>Usual lead:</b> defense, intelligence, diplomatic and national-security law enforcement agencies.</li><li><b>Tools:</b> intelligence collection, deterrence, sanctions, export controls, foreign-investment screening and military options.</li><li><b>Constraint:</b> key information is often classified, which limits what local operators can be told.</li><li><b>Core question:</b> who is doing this, and how do we deter or respond?</li></ul>
<h3>Where They Overlap</h3><p>Federal policy treats water and wastewater as one of the critical infrastructure sectors, because society and the military both depend on them. Many military installations rely on civilian utilities outside the fence. One intrusion can be both a cyber incident, because a vulnerability was exploited, and a national security event, because a foreign state may be positioning to cause harm.</p>
<h3>Why It Is Hard to Choose</h3><p>Attribution is slow and uncertain. Early on, you may not even know whether the problem is malicious. Framing it as national security too soon can slow the operator’s technical response and keep information from those who need it. Treating it as only a cyber incident can miss a strategic threat and the tools to counter it.</p>
<h3>What AI Adds</h3><p>When AI helps run a system, failures can look like attacks and attacks can look like failures. Odd behavior might come from bad data, a software fault or manipulation. That uncertainty is what you will work with in this lab.</p>

 d.innerHTML=`<div class="dh"><button onclick="dlgGo(-1)" aria-label="Previous state" ${n<2?"disabled":""}>‹</button><span id="dct"></span><button onclick="dlgGo(1)" aria-label="Next state" ${n<2?"disabled":""}>›</button><button class="x" onclick="$('#dlg').close()" aria-label="Close">✕</button></div><div class="car"><div class="trk" id="trk">${S.states.map(stCard).join("")}</div></div><div class="df"><button class="btn alt" onclick="rmState()">Remove This State</button><button class="btn" onclick="$('#dlg').close()">Done</button></div>`;dlgPos()}
function dlgPos(){const n=S.states.length;$("#trk").style.transform=`translateX(-${S.dlgI*100}%)`;$("#dct").textContent=`${SN[S.states[S.dlgI]]} · ${S.dlgI+1} of ${n}`}
function dlgGo(d){const n=S.states.length;if(n<2)return;S.dlgI=(S.dlgI+d+n)%n;dlgPos()}
function rmState(){S.states.splice(S.dlgI,1);updMap();renderDlg()}
$("#dlg").addEventListener("keydown",e=>{if(e.key=="ArrowLeft")dlgGo(-1);if(e.key=="ArrowRight")dlgGo(1)});
function togState(k){const i=S.states.indexOf(k);if(i>=0){S.states.splice(i,1);updMap();return}if(S.states.length>=3){$("#msg").textContent="Choose up to three states. Remove one first.";return}S.states.push(k);updMap();openDlg(S.states.length-1)}
function updMap(){document.querySelectorAll(".tile").forEach(t=>{const on=S.states.includes(t.dataset.k);t.classList.toggle("sel",on);t.setAttribute("aria-pressed",on)});
 $("#chips").innerHTML=S.states.map((k,i)=>`<span class="chip"><a href="#" onclick="openDlg(${i});return false">${SN[k]}</a><button onclick="togState('${k}')" aria-label="Remove ${SN[k]}">✕</button></span>`).join("");
 $("#mgo").disabled=$("#rv").disabled=S.states.length<1;$("#msg").textContent="Selected: "+(S.states.map(k=>SN[k]).join(", ")||"none")+" (max 3)"}

/* 6 simulation */
function simHtml(){return `<h2>Simulation</h2><p class="mu">Your policy plays out over 12 weeks in two cases, a malfunction and a deliberate attack, for each state you picked. You don’t have to guess which case you’re in. Results update live once you run it. This is a teaching model with illustrative parameters, not a forecast.</p>
 <div class="card"><h3>Your Policy: ${S.side=="nat"?"National-Security-Led":"Cybersecurity-Led"}</h3><p class="mu" style="margin:0 0 6px">Tune your actions (pick up to three). States: ${S.states.map(k=>SN[k]).join(", ")}</p>
 ${Object.keys(LEV).map(k=>`<label class="chk"><input type="checkbox" ${S.levers.includes(k)?"checked":""} onchange="togSim('${k}',this)"><span>${LEV[k].n}</span></label>`).join("")}</div>
 <div class="card"><h3>Stress Tests</h3><p class="mu">Switch on a twist and see whether your policy still holds.</p>
 ${[["vendor","Vendor delays sharing logs for three weeks"],["adapt","Adversary adapts faster (week 4 onward, deliberate cases)"],["preempt","State AI rules are struck down by a federal action"]].map(o=>`<label class="chk"><input type="checkbox" ${S.tw[o[0]]?"checked":""} onchange="S.tw.${o[0]}=+this.checked;simUpd()"><span>${o[1]}</span></label>`).join("")}</div>
 <div class="card"><h3>Predict First</h3><p class="mu">How will your policy hold up across these states overall?</p>${VL.map(o=>`<label class="r"><input type="radio" name="gs" ${S.guess==o?"checked":""} onchange="S.guess='${o}';$('#run').disabled=false">${o}</label>`).join("")}</div>
 <button class="btn" id="run" onclick="runSim()" ${S.guess?"":"disabled"}>Run Simulation</button><div id="res"></div>`}
function updDots(){$("#pv").textContent=S.p+"%";$("#dots").innerHTML=Array.from({length:100},(_,i)=>`<i class="${i<S.p?"on":""}"></i>`).join("");$("#dtx").textContent=`${S.p} of 100 imagined incidents are deliberate attacks; ${100-S.p} are not.`}
function togSim(k,el){const i=S.levers.indexOf(k);if(i>=0)S.levers.splice(i,1);else if(S.levers.length<3)S.levers.push(k);else el.checked=false;if(!S.levers.length){S.levers.push(k);el.checked=true}document.querySelectorAll(".chk input[onchange^=togSim]").forEach(c=>c.disabled=!c.checked&&S.levers.length>=3);simUpd()}
function simOne(k,lv,N,mode){const m0=(ST[k]&&ST[k].m)||{},m=S.tw.preempt?{}:m0,rg=rng(S.seed),fin=[[],[],[],[]],tr=Array.from({length:13},()=>[[],[],[],[]]),rep=m.rep?(lv.includes("report")?1:.5):1,mal=mode=="mal";
 for(let n=0;n<N;n++){rg();const mu=lv.map(()=>.7+.6*rg());let v=[60,10,40,70];tr[0].forEach((a,j)=>a.push(v[j]));
  for(let w=1;w<=12;w++){const r6=rg();let d=[-.5,1.5,.5,0];lv.forEach((id,i)=>LEV[id].d.forEach((x,j)=>d[j]+=x*mu[i]));
   if(S.side=="nat"){d[1]+=.3;d[2]-=.3}else{d[1]-=.1;d[2]+=.3}
   if(S.tw.vendor&&w<=3)d[2]-=1;if(S.tw.adapt&&mal&&w>=4&&!lv.some(x=>x=="foreign"||x=="mil"))d[1]-=.5;
   d[0]+=(m.H||0)*rep;d[1]+=(m.A||0)*rep;d[2]+=(m.I||0)*rep;v=v.map((x,j)=>Math.max(0,Math.min(100,x+d[j])));
   if(mal&&w==4)v[0]=Math.max(0,v[0]-15*(1-Math.min(1,v[2]/80)));
   if(mal&&w==7&&!lv.some(x=>x=="foreign"||x=="mil"))v[1]=Math.max(0,v[1]-8);
   if(m.pre&&w==6&&r6<m.pre)v[3]=Math.max(0,v[3]-15);
   if(S.tw.preempt&&m0.pre!==undefined&&w==6)v[3]=Math.max(0,v[3]-10);
   tr[w].forEach((a,j)=>a.push(v[j]))}
  v.forEach((x,j)=>fin[j].push(x))}
 const q=(a,p)=>{a.sort((x,y)=>x-y);return a[Math.floor(p*(a.length-1))]};
 const med=[0,1,2,3].map(j=>tr.map(w=>q(w[j],.5))),f=fin.map(a=>({m:q(a,.5),lo:q(a,.1),hi:q(a,.9)}));
 return{med,fin:f,overall:f.reduce((s,x)=>s+x.m,0)/4}}
function runSim(){const sim={},base={};S.states.forEach(k=>{const b=simOne(k,S.levers,300,"ben"),m=simOne(k,S.levers,300,"mal");sim[k]={ben:b,mal:m,overall:(b.overall+m.overall)/2};base[k]=(simOne(k,[],150,"ben").overall+simOne(k,[],150,"mal").overall)/2});S.sim=sim;S.base=base;unlock(6);$("#steps").innerHTML=stepsHtml();showRes()}
function simUpd(){if(!S.sim)return;clearTimeout(simT);simT=setTimeout(runSim,120)}
const COL=["#431C53","#7e4d96","#b08ac4","#241030"],DASH=["","7 4","2 4","9 3 2 3"],CASES=[["ben","If It’s a Malfunction"],["mal","If It’s a Deliberate Attack"]];
function chartSvg(k,c){const W=640,H=220,x=w=>40+w*(W-60)/12,y=v=>H-26-v*(H-46)/100;let g="";[0,50,100].forEach(v=>g+=`<line x1="40" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="32" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mu)">${v}</text>`);
 [0,4,8,12].forEach(w=>g+=`<text x="${x(w)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mu)">Wk ${w}</text>`);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Median trajectory of four outcomes over 12 weeks for ${SN[k]}, ${c=="ben"?"malfunction":"deliberate attack"} case">${g}${OUT.map((o,j)=>`<polyline id="ln-${k}-${c}-${j}" fill="none" stroke="${COL[j]}" stroke-width="2.5" stroke-dasharray="${DASH[j]}"/>`).join("")}</svg>`}
function draw(k,f){const W=640,H=220,x=w=>40+w*(W-60)/12,y=v=>H-26-v*(H-46)/100,n=Math.max(1,Math.floor(f*12+.001)+1);CASES.forEach(([c])=>S.sim[k][c].med.forEach((a,j)=>{$(`#ln-${k}-${c}-${j}`).setAttribute("points",a.slice(0,n).map((v,w)=>x(w)+","+y(v)).join(" "))}))}
function scrub(k,w){draw(k,w/12);$("#sr-"+k).innerHTML=CASES.map(([c,t])=>`<b>${t.replace("If It’s a ","")}, Week ${w}:</b> `+OUT.map((o,j)=>o.split(" ")[0]+" "+Math.round(S.sim[k][c].med[j][w])).join(" · ")).join("<br>")}
function play(k){if(raf2)cancelAnimationFrame(raf2);const t0=performance.now(),L=n=>{const f=Math.min(1,(n-t0)/3000);draw(k,f);if(f<1)raf2=requestAnimationFrame(L)};raf2=requestAnimationFrame(L)}
function showRes(){const ks=S.states,avg=ks.reduce((a,k)=>a+S.sim[k].overall,0)/ks.length,sc=ks.map(k=>S.sim[k].overall),spread=Math.max(...sc)-Math.min(...sc);
 const col=(k,c,t)=>{const r=S.sim[k][c];return `<div class="card" style="margin:0"><h3>${t}</h3><p class="mu" style="margin:0 0 4px">${V(r.overall)}</p>${OUT.map((o,j)=>`<div class="hb"><span>${o}<br><span class="mu" style="font-size:11px">10–90%: ${Math.round(r.fin[j].lo)}–${Math.round(r.fin[j].hi)}</span></span><div class="bar"><i style="width:${r.fin[j].m}%"></i></div><b>${Math.round(r.fin[j].m)}</b></div>`).join("")}${chartSvg(k,c)}</div>`};
 const weak=(k,c)=>{const f=S.sim[k][c].fin,j=f.map(x=>x.m).indexOf(Math.min(...f.map(x=>x.m)));return `${OUT[j]} (${Math.round(f[j].m)})`};
 $("#res").innerHTML=ks.map(k=>{const r=S.sim[k],dl=r.overall-S.base[k];return `<div class="card" style="margin-top:14px"><h3>${SN[k]}: ${V(r.overall)} on Average</h3><p class="mu">${dl>=0?"+":""}${dl.toFixed(1)} points versus doing nothing. ${noteFor(k)}</p>
 <div class="two">${CASES.map(([c,t])=>col(k,c,t)).join("")}</div>
 <p class="mu" style="margin:8px 0 0">${OUT.map((o,j)=>`<span style="color:${COL[j]}"><b>${["━","╍","┅","╌"][j]}</b></span> ${o}`).join(" &nbsp; ")}</p>
 <label class="mu" for="wk-${k}">Scrub through the weeks</label><input id="wk-${k}" type="range" min="0" max="12" value="12" oninput="scrub('${k}',+this.value)"><p class="mu" id="sr-${k}"></p><button class="btn alt" onclick="play('${k}')">Replay the 12 Weeks</button>
 <div class="card warn" style="margin:12px 0 0"><h3>What This Tells You</h3><p style="margin:0">Weakest area in a malfunction: ${weak(k,"ben")}. Weakest area in a deliberate attack: ${weak(k,"mal")}. In the deliberate case the model adds a health shock in week 4 and an adversary who adapts in week 7.</p></div></div>`}).join("")+
 `<div class="card ${S.guess==V(avg)?"":"warn"}"><h3>Your Prediction</h3><p>You predicted <b>${S.guess}</b>. Across your states and both cases the model says <b>${V(avg)}</b>. ${S.guess==V(avg)?"✓ Match.":"The result differed from your prediction."}</p><p class="mu">Spread across selected states: ${spread.toFixed(1)} points. In this model your own policy actions drive most of the result and state AI rules shift it only slightly. That is a modeling assumption, consistent with the finding that most state AI laws do not reach a water plant directly. It is not an empirical result.</p></div>`+contBtn("Continue to Your Certificate",6);
 ks.forEach(k=>scrub(k,12))}
/* 7 certificate */
function certHtml(){return `<h2>Certificate</h2><p class="mu noprint">Confirm the name you want on your certificate, then create it. You can print it or save it as a PDF.</p><div class="noprint"><input type="text" id="nm" maxlength="60" placeholder="Full name" aria-label="Full name" value="${esc(S.cn||S.name)}" oninput="S.cn=this.value.trim();$('#cb2').disabled=!S.cn"><button class="btn" id="cb2" onclick="mkCert()">Create Certificate</button></div><div id="cert"></div>`}
function mkCert(){const nm=S.cn||S.name;if(!nm)return;S.certMade=true;
 $("#cert").innerHTML=`<div class="cert reveal" style="margin-top:16px"><p class="sm">RANDomly Complex</p><h2>Certificate of Completion</h2><p>This certifies that</p><div class="nm">${esc(nm)}</div><p>completed the training exercise <b>AI-Enabled Policy Decision Support: Cybersecurity or National Security</b>, including a scenario briefing, a stakeholder analysis, a policy memo, a review of state AI policies and a policy simulation.</p><p>Stance: ${S.side=="nat"?"National-Security-Led":"Cybersecurity-Led"}<br>States Analyzed: ${S.states.map(k=>SN[k]).join(", ")}<br>Policy Actions Modeled: ${S.levers.map(k=>LEV[k].n).join("; ")}</p><p class="sm">Completed ${new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}. Course exercise prototype, not an accredited credential. Simulation values are illustrative.</p></div><div class="noprint"><button class="btn" onclick="window.print()">Print or Save as a PDF</button></div>`}
/* welcome */
function welcomeHtml(){return `<div class="fwrap"><div class="fold" id="fold"><div class="ftab"><span>CASE 001</span></div><div class="fb"></div>
 <div class="sheet"><h2 style="font-size:19px">Trainee Sign-In Sheet</h2><p class="mu" style="margin:0 0 8px">Case: AI-Enabled Policy Decision Support<br>Date: ${new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}</p>
 <div class="nmg"><label class="mu" for="fn">First Name<input type="text" id="fn" autocomplete="given-name" maxlength="30" oninput="chkSign()"></label><label class="mu" for="ln">Last Name<input type="text" id="ln" autocomplete="family-name" maxlength="30" oninput="chkSign()"></label></div>
 <button class="btn" id="bg" onclick="signIn()" disabled>Begin</button></div>
 <div class="ff" id="ff"><p style="margin:0;font-size:13px;letter-spacing:.2em">CASE FILE 001</p><h2 style="margin:6px 0">RANDomly Complex</h2><p style="margin:0">AI-Enabled Policy Decision Support</p><div class="stamp">TRAINING EXERCISE</div><button class="btn" style="background:#fff;color:#431C53;margin-top:18px" onclick="openFolder()">Open the File</button></div></div>

/* router */
function render(){$("#tip").hidden=true;const v=$("#view");if(!S.name){$("#steps").innerHTML="";v.innerHTML=welcomeHtml();return}$("#steps").innerHTML=stepsHtml();
 if(S.cur==0){v.innerHTML=defineHtml();initDefine()}
 if(S.cur==1){v.innerHTML=scenHtml();initScen()}
 if(S.cur==2){v.innerHTML=problemHtml()}
 if(S.cur==3){v.innerHTML=memoHtml();updM()}

 if(S.cur==5){v.innerHTML=simHtml();if(S.sim&&S.states.every(k=>S.sim[k]))showRes()}

/* scenario animation controls */
function playAnim(){stopAnim();$("#cont").style.display="none";const t0=performance.now(),loop=n=>{const t=(n-t0)/1000;fr(Math.min(t,T));if(t<T)raf=requestAnimationFrame(loop);else ended()};raf=requestAnimationFrame(loop)}
function ended(){$("#cont").style.display="";if(!S.animDone){S.animDone=true;unlock(2);$("#steps").innerHTML=stepsHtml()}}
function skip(){stopAnim();fr(T);ended()}
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=null}
function finish(){unlock(2);go(2)}

/* animation */
const T=13,P=[3.5,6];const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const CAPS=["A civilian community and a military installation draw water from one AI-managed treatment plant.","At the plant, the AI controller starts reporting something unusual.","Chlorine readings climb past the regulatory limit with no clear explanation.","Chlorine is above the limit and nobody yet knows why."];
function scene(){let h="";for(let i=0;i<6;i++){const x=50+(i%3)*80,y=190+Math.floor(i/3)*70;h+=`<rect x="${x}" y="${y}" width="40" height="30" fill="var(--sf)" stroke="var(--mu)"/><polygon points="${x-4},${y} ${x+20},${y-18} ${x+44},${y}" fill="var(--wa)"/>`}
 return `<rect width="800" height="420" fill="var(--sf)"/><g id="w"><rect x="-400" y="150" width="1600" height="400" fill="var(--ground)"/>
 <line x1="400" y1="235" x2="160" y2="235" stroke="var(--water)" stroke-width="5"/><line x1="400" y1="235" x2="600" y2="235" stroke="var(--water)" stroke-width="5"/>${h}
 <text x="150" y="340" font-size="14" text-anchor="middle" fill="var(--tx)">Civilian community</text>
 <rect x="560" y="170" width="200" height="150" fill="none" stroke="var(--tx)" stroke-dasharray="6 4"/><rect x="590" y="200" width="50" height="40" fill="var(--mu)"/><rect x="660" y="200" width="60" height="40" fill="var(--mu)"/><line x1="730" y1="190" x2="730" y2="150" stroke="var(--tx)" stroke-width="2"/><polygon points="730,150 750,157 730,164" fill="var(--wa)"/>
 <text x="660" y="340" font-size="14" text-anchor="middle" fill="var(--tx)">Military installation</text>
 <rect x="370" y="205" width="60" height="50" fill="var(--ac)"/><circle cx="400" cy="195" r="18" fill="var(--water)"/><text x="400" y="278" font-size="12" text-anchor="middle" fill="var(--tx)">AI-managed plant</text></g>
 <g id="ch" opacity="0"><rect x="440" y="40" width="340" height="210" rx="10" fill="var(--sf)" stroke="var(--bd)"/><text x="456" y="64" font-size="13" fill="var(--tx)">Chlorine residual (mg/L, illustrative)</text>
 <line x1="470" x2="765" y1="${230-4/6*150}" y2="${230-4/6*150}" stroke="var(--wa)" stroke-dasharray="5 3"/><text x="765" y="${224-4/6*150}" font-size="11" text-anchor="end" fill="var(--wa)">Regulatory limit 4.0</text>
 <line x1="470" x2="470" y1="80" y2="230" stroke="var(--mu)"/><line x1="470" x2="765" y1="230" y2="230" stroke="var(--mu)"/><polyline id="ln" fill="none" stroke="var(--ac)" stroke-width="2.5" points=""/><text id="val" x="456" y="244" font-size="14" font-weight="700" fill="var(--tx)"></text></g>`}
function fr(t){const k=t<P[0]?0:t<P[1]?ease((t-P[0])/(P[1]-P[0])):1,s=1+1.3*k,tx=k*(220-2.3*400),ty=k*(210-2.3*235);
 $("#w").setAttribute("transform",`translate(${tx} ${ty}) scale(${s})`);
 const o=Math.max(0,Math.min(1,(t-P[1])/.8));$("#ch").setAttribute("opacity",o);
 const q=Math.max(0,Math.min(1,(t-P[1])/(T-1-P[1]))),n=Math.floor(q*60);let pts="",last=1.5;
 for(let i=0;i<=n;i++){const r=i/60,v=1.5+.18*Math.sin(i*.9)+(r>.4?Math.pow((r-.4)/.6,1.4)*4.2:0);last=v;pts+=(470+r*295)+","+(230-v/6*150)+" "}
 $("#ln").setAttribute("points",pts);$("#val").textContent=t>=P[1]?(last>4?"⚠ ":"")+last.toFixed(1)+" mg/L":"";
 const ph=t<P[0]?0:t<P[1]?1:t<T-1?2:3;$("#cap").textContent=CAPS[ph];$("#tp").style.width=Math.min(100,t/T*100)+"%"}

render();
</script></body></html>
