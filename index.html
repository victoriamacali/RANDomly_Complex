<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RANDomly Complex</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#0f1b2d;--mu:#5a6577;--bd:#d9dde4;--ac:#0b5fa5;--wa:#b45309;--ok:#15803d;--ground:#e4e9e1;--water:#3b82c4}
@media (prefers-color-scheme:dark){:root{--bg:#0d1520;--sf:#16212f;--tx:#eef2f7;--mu:#9aa6b8;--bd:#2b3a4e;--ac:#5aa9f0;--wa:#f2a53b;--ok:#4ade80;--ground:#1d2b22;--water:#5aa9f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 20px 64px}
h1{font-size:22px;margin:0}h2{font-size:22px;margin:0 0 6px}h3{font-size:16px;margin:0 0 4px}
.sub{color:var(--mu);font-size:14px;margin:2px 0 16px}.mu{color:var(--mu);font-size:14px}
.steps{display:flex;gap:6px;margin:0 0 22px}
.steps button{all:unset;flex:1;text-align:center;font-size:13px;padding:8px 4px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);cursor:pointer}
.steps button.on{border-color:var(--ac);color:var(--tx);font-weight:600}
.steps button.ok{color:var(--ok)}.steps button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px;margin:0 0 14px}
.box{height:300px;overflow-y:auto;padding:18px 20px;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.box h3{margin-top:16px;color:var(--ac)}.box p,.box li{font-size:15px}.box ul{padding-left:20px;margin:4px 0}
.hint{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu);margin:8px 0 14px}
.meter{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:600 15px inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.reveal{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
svg{width:100%;height:auto;display:block;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.cap{min-height:52px;font-size:17px;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.grid .card{margin:0;padding:12px 14px}.grid p{margin:0;font-size:14px;color:var(--mu)}
label.r{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
textarea{width:100%;min-height:150px;font:15px/1.5 inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.warn{border-left:4px solid var(--wa)}.good{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
</style></head><body><div class="wrap">
<h1>RANDomly Complex</h1>
<p class="sub">AI-enabled policy decision support · prototype · scenario values are illustrative</p>
<div class="steps" id="steps"></div>
<div id="view"></div>
</div>
<script>
const NAMES=["1 Define","2 Scenario","3 The Problem","4 Policy Lab"];
const S={cur:0,max:0,scrolled:false,animDone:false,frame:"",text:"",submitted:false};
const $=s=>document.querySelector(s);let raf=null;
function go(i){if(i>S.max)return;stopAnim();S.cur=i;render();window.scrollTo(0,0)}
function unlock(i){S.max=Math.max(S.max,i)}
const DEF=`<h3>Why the label matters</h3><p>Policy problems rarely arrive labeled. Whether an incident is called a cybersecurity threat or a national security threat decides who leads, which authorities apply, what information can be shared and which tools are on the table.</p>
<h3>Cybersecurity threats</h3><ul><li><b>What:</b> efforts to compromise the confidentiality, integrity or availability of computer systems, and of the data and physical processes they control.</li><li><b>Actors:</b> criminals, insiders, activists and sometimes states.</li><li><b>Usual lead:</b> the system’s owner and operator, supported by civilian agencies. For drinking water, EPA is the lead federal agency for the sector, CISA supports technical defense and information sharing, and the FBI investigates crimes.</li><li><b>Tools:</b> patching, network segmentation, incident response, information sharing, and regulation of operators.</li><li><b>Core question:</b> how do we protect, detect and recover?</li></ul>
<h3>National security threats</h3><ul><li><b>What:</b> threats to a nation’s sovereignty, territory, military capability or the core functions of government.</li><li><b>Actors:</b> most often foreign states or state-directed groups, or terrorist organizations.</li><li><b>Usual lead:</b> defense, intelligence, diplomatic and national-security law enforcement agencies.</li><li><b>Tools:</b> intelligence collection, deterrence, sanctions, export controls, foreign-investment screening and military options.</li><li><b>Constraint:</b> key information is often classified, which limits what local operators can be told.</li><li><b>Core question:</b> who is doing this, and how do we deter or respond?</li></ul>
<h3>Where they overlap</h3><p>Federal policy treats water and wastewater as one of the critical infrastructure sectors, because society and the military both depend on them. Many military installations rely on civilian utilities outside the fence. One intrusion can be both a cyber incident, because a vulnerability was exploited, and a national security event, because a foreign state may be positioning to cause harm.</p>
<h3>Why it is hard to choose</h3><p>Attribution is slow and uncertain. Early on, you may not even know whether the problem is malicious. Framing it as national security too soon can slow the operator’s technical response and keep information from those who need it. Treating it as only a cyber incident can miss a strategic threat and the tools to counter it.</p>
<h3>What AI adds</h3><p>When AI helps run a system, failures can look like attacks and attacks can look like failures. Odd behavior might come from bad data, a software fault or manipulation. That uncertainty is what you will work with in this lab.</p>
<p class="mu">You have reached the end. Continue below.</p>`;
const STAKE=[["Utility operators","Keep water safe and the plant running. Concerned about liability and reputation."],["Community and public health officials","Safe water now, and clear, timely information for residents."],["Military installation commander","Protect personnel and mission readiness. Wants to know if the base is targeted."],["EPA and CISA","Water-sector oversight and technical defense. Need data from the operator."],["Intelligence and law enforcement","Determine whether a foreign actor is involved. Preserve evidence and sources."],["Vendor and investors with foreign ties","Protect commercial interests while facing scrutiny of ownership and access."]];
function sents(t){return(t.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[]).filter(s=>s.trim().split(/\s+/).length>=4).length}
function stepsHtml(){return NAMES.map((n,i)=>`<button class="${i==S.cur?"on":""} ${i<S.max?"ok":""}" ${i>S.max?"disabled":""} onclick="go(${i})">${n}</button>`).join("")}
function render(){
 $("#steps").innerHTML=stepsHtml();
 const v=$("#view");
 if(S.cur==0){v.innerHTML=`<h2>Cybersecurity threats and national security threats</h2><p class="mu">Read the full explainer. The next step appears when you reach the bottom.</p>
 <div class="box" id="box" tabindex="0" aria-label="Scrollable explainer">${DEF}</div>
 <div class="hint"><span id="pct">0%</span><div class="meter"><i id="mt"></i></div></div>
 <p class="mu">Draft text written with AI assistance. Verify agency roles against primary sources before relying on them.</p><div id="sc"></div>`;
  const box=$("#box"),chk=()=>{const p=Math.min(1,box.scrollTop/(box.scrollHeight-box.clientHeight));$("#mt").style.width=(p*100)+"%";$("#pct").textContent=Math.round(p*100)+"%";if(p>=.99&&!S.scrolled){S.scrolled=true;showSc()}};
  box.addEventListener("scroll",chk);if(S.scrolled){$("#mt").style.width="100%";$("#pct").textContent="100%";showSc()}}
 if(S.cur==1){v.innerHTML=`<h2>Scenario</h2><svg id="svg" viewBox="0 0 800 420" role="img" aria-label="Animation: a community and a military base share one water plant; chlorine readings then rise"></svg>
 <div class="cap" id="cap" aria-live="polite"></div><div class="meter" style="margin-bottom:12px"><i id="tp"></i></div>
 <button class="btn alt" onclick="skip()">Skip</button> <button class="btn" id="cont" style="display:none" onclick="finish()">Continue</button>`;startAnim()}
 if(S.cur==2){v.innerHTML=`<h2>The Problem: Cybersecurity or National Security?</h2>
 <div class="card"><h3>Scenario</h3><p style="margin:0">An AI-managed water treatment system serves a civilian community and a nearby military installation. Chlorine levels are varying without explanation. Ownership, vendors and investors span several countries.</p></div>
 <h3>Stakeholders</h3><div class="grid">${STAKE.map(s=>`<div class="card"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div>
 <h3 style="margin-top:18px">Competing interests</h3><div class="card"><ul style="margin:0;padding-left:20px"><li>Restoring safe water fast versus preserving evidence of what happened.</li><li>Public transparency versus protecting sources and classified information.</li><li>Civilian authority over a utility versus military force-protection needs.</li></ul></div>
 <div class="card warn"><h3>What is uncertain</h3><p style="margin:0;color:var(--mu);font-size:14px">The cause could be a sensor fault, an AI controller error, a cyber intrusion or a deliberate foreign act. Evidence so far cannot tell these apart, and attribution may take time.</p></div>
 <h3 style="margin-top:18px">Your assessment</h3><p class="mu">Choose a framing, then write 4–5 sentences: state your framing, who should lead and why, the key uncertainty, and the main trade-off you accept.</p>
 ${["Primarily a cybersecurity threat","Primarily a national security threat","Both, handled jointly"].map(f=>`<label class="r"><input type="radio" name="fr" value="${f}" ${S.frame==f?"checked":""} onchange="S.frame=this.value;upd()">${f}</label>`).join("")}
 <textarea id="ta" aria-label="Threat-framing and stakeholder assessment" oninput="S.text=this.value;upd()">${S.text}</textarea>
 <p class="mu" id="cnt"></p><button class="btn" id="sub" onclick="submitA()">Submit assessment</button><div id="done">${S.submitted?`<div class="card" style="margin-top:14px"><p class="good" style="margin:0 0 10px"><b>Assessment saved.</b> Module 02 is unlocked.</p><button class="btn" onclick="go(3)">Continue to the Policy Lab</button></div>`:""}</div>`;upd()}
 if(S.cur==3){v.innerHTML=`<h2>Module 02 · The Policy Lab: Governing AI Under Uncertainty</h2><p class="mu">Examine relevant federal policies, AI governance, regulatory responsibilities and institutional authorities.</p>
 <div class="card"><h3>Your Module 01 assessment</h3><p class="mu" style="margin:0 0 6px">Framing: <b>${S.frame}</b></p><p style="margin:0;white-space:pre-wrap">${S.text.replace(/</g,"&lt;")}</p></div>
 <div class="card warn"><h3>Next build</h3><p style="margin:0;color:var(--mu);font-size:14px">This screen will walk through which agencies hold authority over each part of the scenario and how AI governance rules apply, so you can test your framing against them.</p></div>`}
}
function showSc(){const e=$("#sc");if(!e||e.innerHTML)return;e.innerHTML=`<div class="card reveal"><h2>Demonstration scenario</h2><p>An AI-managed water treatment system serves a civilian community and a nearby military installation. Operators notice unexplained swings in chlorine levels. The plant’s ownership, vendors and investors span several countries. You advise a senior decision-maker who must decide how to frame the problem.</p><button class="btn" onclick="unlock(1);go(1)">Next: watch it unfold</button></div>`}
function upd(){const n=sents(S.text),ok=n>=4&&n<=5&&S.frame;$("#cnt").textContent=n+" sentence"+(n==1?"":"s")+" · need 4–5 (each at least 4 words)";$("#sub").disabled=!ok}
function submitA(){S.submitted=true;unlock(3);$("#done").innerHTML=`<div class="card reveal" style="margin-top:14px"><p class="good" style="margin:0 0 10px"><b>Assessment saved.</b> Module 02 is unlocked.</p><button class="btn" onclick="go(3)">Continue to the Policy Lab</button></div>`;$("#steps").innerHTML=stepsHtml()}
/* animation */
const T=13,P=[3.5,6];const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const CAPS=["A civilian community and a military installation draw water from one AI-managed treatment plant.","At the plant, the AI controller starts reporting something unusual.","Chlorine readings climb past the regulatory limit with no clear explanation.","Malfunction, intrusion or deliberate act? The framing you choose will shape the response."];
function scene(){let h="";for(let i=0;i<6;i++){const x=50+(i%3)*80,y=190+Math.floor(i/3)*70;h+=`<rect x="${x}" y="${y}" width="40" height="30" fill="var(--sf)" stroke="var(--mu)"/><polygon points="${x-4},${y} ${x+20},${y-18} ${x+44},${y}" fill="var(--wa)"/>`}
 return `<rect width="800" height="420" fill="var(--sf)"/><g id="w"><rect x="-400" y="150" width="1600" height="400" fill="var(--ground)"/>
 <line x1="400" y1="235" x2="160" y2="235" stroke="var(--water)" stroke-width="5"/><line x1="400" y1="235" x2="600" y2="235" stroke="var(--water)" stroke-width="5"/>${h}
 <text x="150" y="340" font-size="14" text-anchor="middle" fill="var(--tx)">Civilian community</text>
 <rect x="560" y="170" width="200" height="150" fill="none" stroke="var(--tx)" stroke-dasharray="6 4"/><rect x="590" y="200" width="50" height="40" fill="var(--mu)"/><rect x="660" y="200" width="60" height="40" fill="var(--mu)"/><line x1="730" y1="190" x2="730" y2="150" stroke="var(--tx)" stroke-width="2"/><polygon points="730,150 750,157 730,164" fill="var(--wa)"/>
 <text x="660" y="340" font-size="14" text-anchor="middle" fill="var(--tx)">Military installation</text>
 <rect x="370" y="205" width="60" height="50" fill="var(--ac)"/><circle cx="400" cy="195" r="18" fill="var(--water)"/><text x="400" y="278" font-size="12" text-anchor="middle" fill="var(--tx)">AI-managed plant</text></g>
 <g id="ch" opacity="0"><rect x="440" y="40" width="340" height="210" rx="10" fill="var(--sf)" stroke="var(--bd)"/><text x="456" y="64" font-size="13" fill="var(--tx)">Chlorine residual (mg/L, illustrative)</text>
 <line x1="470" x2="765" y1="${230-4/6*150}" y2="${230-4/6*150}" stroke="var(--wa)" stroke-dasharray="5 3"/><text x="765" y="${224-4/6*150}" font-size="11" text-anchor="end" fill="var(--wa)">Regulatory limit 4.0</text>
 <line x1="470" x2="470" y1="80" y2="230" stroke="var(--mu)"/><line x1="470" x2="765" y1="230" y2="230" stroke="var(--mu)"/><polyline id="ln" fill="none" stroke="var(--ac)" stroke-width="2.5" points=""/><text id="val" x="456" y="244" font-size="14" font-weight="700" fill="var(--tx)"></text></g>`}
function fr(t){const k=t<P[0]?0:t<P[1]?ease((t-P[0])/(P[1]-P[0])):1,s=1+1.3*k,tx=k*(220-2.3*400),ty=k*(210-2.3*235);
 $("#w").setAttribute("transform",`translate(${tx} ${ty}) scale(${s})`);
 const o=Math.max(0,Math.min(1,(t-P[1])/.8));$("#ch").setAttribute("opacity",o);
 const q=Math.max(0,Math.min(1,(t-P[1])/(T-1-P[1]))),n=Math.floor(q*60);let pts="",last=1.5;
 for(let i=0;i<=n;i++){const r=i/60,v=1.5+.18*Math.sin(i*.9)+(r>.4?Math.pow((r-.4)/.6,1.4)*4.2:0);last=v;pts+=(470+r*295)+","+(230-v/6*150)+" "}
 $("#ln").setAttribute("points",pts);$("#val").textContent=t>=P[1]?last.toFixed(1)+" mg/L":"";$("#val").setAttribute("fill",last>4?"var(--wa)":"var(--tx)");
 const ph=t<P[0]?0:t<P[1]?1:t<T-1?2:3;$("#cap").textContent=CAPS[ph];$("#tp").style.width=Math.min(100,t/T*100)+"%"}
function startAnim(){$("#svg").innerHTML=scene();if(matchMedia("(prefers-reduced-motion:reduce)").matches){fr(T);ended();return}
 if(S.animDone){fr(T);$("#cont").style.display="";return}
 const t0=performance.now();const loop=n=>{const t=(n-t0)/1000;fr(Math.min(t,T));if(t<T)raf=requestAnimationFrame(loop);else ended()};raf=requestAnimationFrame(loop)}
function ended(){$("#cont").style.display="";if(!S.animDone){S.animDone=true;unlock(2);setTimeout(()=>{if(S.cur==1)finish()},1800)}}
function skip(){stopAnim();fr(T);ended()}
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=null}
function finish(){unlock(2);go(2)}
render();
</script></body></html>
